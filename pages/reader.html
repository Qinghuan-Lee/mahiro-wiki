<dialog id="reader" aria-labelledby="reader-title">
  <div class="reader-toolbar">
    <span>mahiro-wiki / article</span>
    <button id="close-reader" aria-label="关闭文章">关闭 ✕</button>
  </div>
  <article class="reader-body">
    <div id="reader-meta"></div>
    <h1 id="reader-title"></h1>
    <p id="reader-intro" class="reader-intro"></p>
    <div id="reader-content"></div>
    <div class="reader-end">—</div>
    <button id="next-article">读下一篇 ↗</button>
  </article>
</dialog>
