      <div class="polaroid card-book"><span class="drawing">▤<i>✿</i></span><small>04 / READ</small></div>
    </div>
    <section class="greeting-card frosted">
      <div class="greeting-avatar" aria-hidden="true">
        <svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="47" fill="#fff0ac"/><path d="M25 48 28 26 44 37q7-3 14 0l15-11 3 23q9 11 2 25-8 15-27 15T24 73q-8-13 1-25" fill="#fbfaf1" stroke="#d5ccb8" stroke-width="2"/><path d="M38 57q4 6 8 0m12 0q4 6 8 0" fill="none" stroke="#455d54" stroke-width="3" stroke-linecap="round"/><path d="m48 65 4-2 4 2-4 4z" fill="#e69b99"/><path d="m26 63-12-2m12 7-12 2m60-7 12-2m-12 7 12 2" stroke="#909486" stroke-width="2" stroke-linecap="round"/></svg>

    <section class="random-card frosted" id="random-post" hidden><span class="card-label">随机推荐</span><a id="random-link"><span class="random-icon">✳</span><span><small>点开一篇</small><b id="random-title"></b></span><span>↗</span></a></section>

    <span class="tiny-heart" aria-hidden="true">♥</span>
